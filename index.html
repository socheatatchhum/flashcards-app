<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f7fb" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#151923" media="(prefers-color-scheme: dark)">
    <title>Flashcards</title>
    <link rel="stylesheet" href="styles.css">
    <script src="storage.js" defer></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <div class="app">
      <header class="app-header">
        <a class="brand" href="#" aria-label="Flashcards home">Flashcards</a>
        <button class="button button-primary" id="new-deck" type="button">New Deck</button>
      </header>

      <aside class="deck-sidebar" aria-labelledby="decks-heading">
        <h2 id="decks-heading">Your decks</h2>
        <nav aria-label="Flashcard decks">
          <ul class="deck-list" id="deck-list"></ul>
        </nav>
      </aside>

      <main class="card-area">
        <section class="study-session" aria-labelledby="deck-title">
          <div class="study-heading">
            <div>
              <p class="eyebrow">Study deck</p>
              <h1 id="deck-title" aria-live="polite"></h1>
            </div>
            <p class="card-count" id="card-count" aria-live="polite" aria-atomic="true"></p>
          </div>

          <p id="study-status" class="visually-hidden" role="status"></p>

          <div class="toolbar" role="group" aria-label="Deck tools">
            <label class="search-field">
              <span class="visually-hidden">Search this deck</span>
              <input id="card-search" type="search" placeholder="Search cards..." autocomplete="off">
            </label>
            <div class="toolbar-actions">
                <button class="button button-secondary" id="enter-study" type="button">Study</button>
              <button class="button button-primary" id="new-card" type="button">New Card</button>
            </div>
          </div>

          <article class="card" id="flashcard" aria-live="polite" aria-atomic="true" aria-label="Flashcard">
            <div class="card-inner">
              <div class="card-face card-front" id="flashcard-front">
                <p class="eyebrow">Front</p>
                <p class="card-prompt" id="front-content"></p>
              </div>
              <div class="card-face card-back" id="flashcard-back" aria-hidden="true">
                <p class="eyebrow">Back</p>
                <p class="card-prompt" id="back-content"></p>
              </div>
            </div>
          </article>

          <div class="card-controls" id="study-controls" role="group" aria-label="Study controls" hidden>
            <button class="button button-secondary" id="shuffle-cards" type="button">Shuffle</button>
            <button class="button button-secondary" id="previous-card" type="button">Previous</button>
            <button class="button button-flip" id="flip-card" type="button" aria-pressed="false">Flip card</button>
            <button class="button button-secondary" id="next-card" type="button">Next</button>
            <button class="button button-secondary" id="exit-study" type="button">Exit study</button>
          </div>

          <section class="card-library" id="card-library" aria-labelledby="card-library-heading">
            <div class="card-library-heading">
              <h2 id="card-library-heading">Cards in this deck</h2>
              <span class="library-count" id="library-count" aria-live="polite" aria-atomic="true"></span>
            </div>
            <ul class="card-list" id="card-list" aria-label="Deck cards"></ul>
          </section>
        </section>
      </main>

      <footer class="app-footer">
        <p>Study with Space to flip and the arrow keys to navigate. Search to find cards in this deck.</p>
      </footer>
    </div>

    <dialog class="entry-dialog" id="entry-dialog" aria-labelledby="entry-title">
      <form class="entry-form" id="entry-form" novalidate>
        <div class="entry-heading">
          <h2 id="entry-title"></h2>
          <button class="dialog-close" id="close-entry" type="button" aria-label="Close">×</button>
        </div>
        <label class="entry-field" id="first-field-label">
          <span id="first-field-caption">Front</span>
          <input id="entry-first" type="text" required>
        </label>
        <label class="entry-field" id="second-field-label">
          <span id="second-field-caption">Back</span>
          <textarea id="entry-second" rows="3" required></textarea>
        </label>
        <p class="entry-error" id="entry-error" role="alert" hidden></p>
        <div class="entry-actions">
          <button class="button button-secondary" id="cancel-entry" type="button">Cancel</button>
          <button class="button button-primary" type="submit">Save</button>
        </div>
      </form>
    </dialog>
  </body>
</html>
